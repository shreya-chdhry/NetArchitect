!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
! NETARCHITECT: CISCO IOS MULTI-DEVICE CONFIGURATION EXPORT
! Network Name        : Global Enterprise IoT WAN
! Scenario Profile    : GLOBAL_WAN
! Architecture Pattern: Hub-and-Spoke with Partial Mesh IPsec Overlay
! Physical Layer Link : OS2 Single-Mode Fiber (9/125 µm core) (10GBASE-ZR / DWDM (ITU-T G.698.1))
! Primary Routing     : Multi-Area OSPFv2 + eBGP (External BGP-4)
! Root Addressing     : 10.0.0.0/8
!
! TARGET HARDWARE MODELS (PACKET TRACER / GNS3 VERIFIED):
!   - DEVICE 1: Cisco Catalyst 3650-24PS (Multilayer Switch, Cisco IOS-XE 16.x)
!   - DEVICE 2: Cisco Catalyst 2960-24TT (Layer 2 Edge Switch, Cisco IOS 15.0)
!   - DEVICE 3: Cisco ISR 4321 (Enterprise WAN Edge Router, Cisco IOS-XE 16.x)
!
! DEPLOYMENT INSTRUCTIONS:
! This file contains 3 DISTINCT, role-separated device configurations.
! Copy each designated section into the corresponding device console in Packet Tracer.
! Do not paste the entire file into a single device.
!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

===============================================================================
! DEVICE 1 OF 3: CORE / MULTILAYER DISTRIBUTION SWITCH
! Hostname: GLOBAL-ENTERPRISE-IOT-WAN-CORE-DISTR
! Device Role: Inter-VLAN Routing (SVIs), Core OSPF, Trunk Downlinks, ACL Enforcement
! Target Hardware Model: Cisco Catalyst 3650-24PS (Multilayer Switch, Cisco IOS-XE)
! Model Compatibility Note: Catalyst 3650 natively runs IEEE 802.1Q encapsulation;
! 'switchport trunk encapsulation dot1q' is unsupported and omitted.
===============================================================================
enable
configure terminal
hostname GLOBAL-ENTERPRISE-IOT-WAN-CORE-DISTR
!
! --- Device Management & SSH Hardening ---
service password-encryption
no ip domain-lookup
ip domain-name netarchitect.local
username admin privilege 15 secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
!
! --- Global Layer 3 Switching & Routing ---
ip routing
ipv6 unicast-routing
ip cef
!
! --- Spanning Tree Protocol Hardening (IEEE 802.1w Rapid-PVST+) ---
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree vlan 1-4094 priority 24576
!
! --- IEEE 802.1Q VLAN Database ---
vlan 99
 name Network_Management
 state active
!
vlan 999
 name Unused_Native_Blackhole
 state active
!
vlan 10
 name NYC_Hub_and_Core_Operations
 state active
!
vlan 20
 name London_Regional_Gateway
 state active
!
vlan 30
 name Tokyo_Logistics_and_Scanners
 state active
!
vlan 40
 name Singapore_Distribution_IoT
 state active
!
vlan 50
 name Cloud_VPC_Analytics_Transit
 state active
!
! --- Hardened Distribution Trunk Downlink to Access Switch ---
interface GigabitEthernet1/0/1
 description Trunk-Downlink-To-Access-Switch-01
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 99,10,20,30,40,50
 switchport nonegotiate
 no shutdown
!
! --- Layer 3 Switched Virtual Interfaces (SVIs) as Default Gateways ---
interface Vlan99
 description SVI: Out-of-Band Network Management Gateway
 ip address 10.255.99.1 255.255.255.0
 no shutdown
!
interface Vlan10
 description Default-Gateway-for-NYC_Hub_and_Core_Operations
 ip address 10.0.0.1 255.255.252.0
 no shutdown
!
interface Vlan20
 description Default-Gateway-for-London_Regional_Gateway
 ip address 10.0.4.1 255.255.254.0
 no shutdown
!
interface Vlan30
 description Default-Gateway-for-Tokyo_Logistics_and_Scanners
 ip address 10.0.6.1 255.255.254.0
 ip access-group HARDENED-INTERVLAN-ACL in
 no shutdown
!
interface Vlan40
 description Default-Gateway-for-Singapore_Distribution_IoT
 ip address 10.0.8.1 255.255.255.0
 ip access-group HARDENED-INTERVLAN-ACL in
 no shutdown
!
interface Vlan50
 description Default-Gateway-for-Cloud_VPC_Analytics_Transit
 ip address 10.0.9.1 255.255.255.128
 no shutdown
!
! --- Layer 3 Routed Interconnect to Edge Router ---
interface GigabitEthernet1/0/24
 description Routed-Link-To-WAN-Edge-Router
 no switchport
 ip address 10.255.255.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
! --- Core OSPF Routing Protocol Engine ---
router ospf 1
 router-id 1.1.1.2
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet1/0/24
 network 10.255.255.0 0.0.0.3 area 0
 network 10.255.99.0 0.0.0.255 area 0
 network 10.0.0.0 0.0.3.255 area 10
 network 10.0.4.0 0.0.1.255 area 10
 network 10.0.6.0 0.0.1.255 area 10
 network 10.0.8.0 0.0.0.255 area 10
 network 10.0.9.0 0.0.0.127 area 10
 area 10 range 10.0.0.0 255.255.240.0
!
! --- Enterprise Access Control Lists (ACLs) ---
! Traffic Direction: INBOUND on isolated SVIs ('ip access-group HARDENED-INTERVLAN-ACL in')
! Enforced Security Policy Ordering:
!   1. PERMIT DHCP discovery and DNS queries to local default gateway
!   2. PERMIT ICMP Echo strictly to local default gateway (link reachability test)
!   3. STRICT DENY: Drop all traffic from quarantined subnets to private RFC 1918 LANs
!   4. PERMIT established TCP return sessions (outbound cloud/internet replies)
!   5. PERMIT outbound non-RFC 1918 public internet/cloud destinations
ip access-list extended HARDENED-INTERVLAN-ACL
 remark --- Quarantined Subnet: Tokyo_Logistics_and_Scanners (VLAN 30) ---
 remark Permit DHCP to local broadcast / gateway relay
 permit udp 10.0.6.0 0.0.1.255 host 255.255.255.255 eq bootps
 permit udp 10.0.6.0 0.0.1.255 host 10.0.6.1 eq bootps
 remark Permit DNS to local default gateway
 permit udp 10.0.6.0 0.0.1.255 host 10.0.6.1 eq domain
 permit tcp 10.0.6.0 0.0.1.255 host 10.0.6.1 eq domain
 remark Permit ICMP Echo strictly to local default gateway (10.0.6.1)
 permit icmp 10.0.6.0 0.0.1.255 host 10.0.6.1 echo
 permit icmp 10.0.6.0 0.0.1.255 host 10.0.6.1 echo-reply
 remark STRICT ISOLATION: Deny access from Tokyo_Logistics_and_Scanners to private RFC 1918 corporate networks
 deny ip 10.0.6.0 0.0.1.255 10.0.0.0 0.255.255.255
 deny ip 10.0.6.0 0.0.1.255 172.16.0.0 0.15.255.255
 deny ip 10.0.6.0 0.0.1.255 192.168.0.0 0.0.255.255
 remark --- Quarantined Subnet: Singapore_Distribution_IoT (VLAN 40) ---
 remark Permit DHCP to local broadcast / gateway relay
 permit udp 10.0.8.0 0.0.0.255 host 255.255.255.255 eq bootps
 permit udp 10.0.8.0 0.0.0.255 host 10.0.8.1 eq bootps
 remark Permit DNS to local default gateway
 permit udp 10.0.8.0 0.0.0.255 host 10.0.8.1 eq domain
 permit tcp 10.0.8.0 0.0.0.255 host 10.0.8.1 eq domain
 remark Permit ICMP Echo strictly to local default gateway (10.0.8.1)
 permit icmp 10.0.8.0 0.0.0.255 host 10.0.8.1 echo
 permit icmp 10.0.8.0 0.0.0.255 host 10.0.8.1 echo-reply
 remark STRICT ISOLATION: Deny access from Singapore_Distribution_IoT to private RFC 1918 corporate networks
 deny ip 10.0.8.0 0.0.0.255 10.0.0.0 0.255.255.255
 deny ip 10.0.8.0 0.0.0.255 172.16.0.0 0.15.255.255
 deny ip 10.0.8.0 0.0.0.255 192.168.0.0 0.0.255.255
 remark Permit return traffic for established TCP sessions
 permit tcp any any established
 remark Permit outbound public Internet / Cloud traffic (RFC 1918 private subnets already denied)
 permit ip any any
!
! --- Device Management Line Security ---
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
end

===============================================================================
! DEVICE 2 OF 3: ACCESS LAYER EDGE SWITCH
! Hostname: GLOBAL-ENTERPRISE-IOT-WAN-ACCESS-SW01
! Device Role: Layer 2 Endpoint Access Ports, 802.1Q Edge Security, STP PortFast/BPDU Guard
! Target Hardware Model: Cisco Catalyst 2960-24TT (Layer 2 Switch, Cisco IOS 15.0)
===============================================================================
enable
configure terminal
hostname GLOBAL-ENTERPRISE-IOT-WAN-ACCESS-SW01
!
! --- Device Management & SSH Hardening ---
service password-encryption
no ip domain-lookup
ip domain-name netarchitect.local
username admin privilege 15 secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
!
! --- Layer 2 Spanning Tree (Rapid-PVST+) ---
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
! --- IEEE 802.1Q VLAN Database ---
vlan 99
 name Network_Management
 state active
!
vlan 999
 name Unused_Native_Blackhole
 state active
!
vlan 10
 name NYC_Hub_and_Core_Operations
 state active
!
vlan 20
 name London_Regional_Gateway
 state active
!
vlan 30
 name Tokyo_Logistics_and_Scanners
 state active
!
vlan 40
 name Singapore_Distribution_IoT
 state active
!
vlan 50
 name Cloud_VPC_Analytics_Transit
 state active
!
! --- Hardened Trunk Uplink to Core Distribution Switch ---
interface GigabitEthernet0/1
 description Trunk-Uplink-To-Core-Distribution-Switch
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 99,10,20,30,40,50
 switchport nonegotiate
 no shutdown
!
! --- Workstation & Endpoint Access Ports (Representative 24-Port Switch) ---
! ARCHITECTURAL SCALING NOTE:
! The following 24 FastEthernet ports represent a single Access Layer edge switch (Catalyst 2960-24TT)
! deployed in a floor wiring closet. This demonstrates representative 802.1Q port assignment and
! port security (PortFast, BPDU Guard), NOT a full physical chassis deployment for the entire
! scenario (2,000 total endpoints). In production, multiple 24/48-port switches are
! aggregated in stacks (Cisco FlexStack) or connected via redundant uplinks.
!
interface range FastEthernet0/1 - 5
 description Access-Ports: NYC_Hub_and_Core_Operations (VLAN 10)
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range FastEthernet0/6 - 10
 description Access-Ports: London_Regional_Gateway (VLAN 20)
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range FastEthernet0/11 - 15
 description Access-Ports: Tokyo_Logistics_and_Scanners (VLAN 30)
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range FastEthernet0/16 - 20
 description Access-Ports: Singapore_Distribution_IoT (VLAN 40)
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
interface range FastEthernet0/21 - 24
 description Access-Ports: Cloud_VPC_Analytics_Transit (VLAN 50)
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
!
! --- Access Switch In-Band Management SVI ---
interface Vlan99
 description In-Band Switch Management Interface
 ip address 10.255.99.10 255.255.255.0
 no shutdown
!
ip default-gateway 10.255.99.1
!
! --- Device Management Line Security ---
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
end

===============================================================================
! DEVICE 3 OF 3: ENTERPRISE WAN EDGE ROUTER
! Hostname: GLOBAL-ENTERPRISE-IOT-WAN-EDGE-RTR
! Device Role: Physical Media WAN Termination, Edge OSPF, eBGP Peering, IPsec VPN, QoS
! Target Hardware Model: Cisco ISR 4321 (Integrated Services Router, Cisco IOS-XE)
===============================================================================
enable
configure terminal
hostname GLOBAL-ENTERPRISE-IOT-WAN-EDGE-RTR
!
! --- Device Management & SSH Hardening ---
service password-encryption
no ip domain-lookup
ip domain-name netarchitect.local
username admin privilege 15 secret Cisco123!
crypto key generate rsa modulus 2048
ip ssh version 2
!
! --- LAN Interface to Core Distribution Switch ---
interface GigabitEthernet0/0/0
 description Interconnect-To-Core-Switch
 ip address 10.255.255.1 255.255.255.252
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 no shutdown
!
! --- WAN Interface (Physical Media Termination) ---
! Recommended Physical Media: OS2 Single-Mode Fiber (9/125 µm core)
! Transceiver Standard      : SFP-10G-ZR / Tunable DWDM (10GBASE-ZR / DWDM (ITU-T G.698.1))
! Physical Distance         : 55,000.0m (55.00 km)
interface GigabitEthernet0/0/1
 description WAN-Uplink-To-Provider-(10GBASE-ZR / DWDM (ITU-T G.698.1))
 ! NOTE: 198.51.100.0/24 is an RFC 5737 TEST-NET-2 documentation/lab address for simulation.
 ! In production environments, replace with routable public IP assigned by ISP/Telco.
 ip address 198.51.100.2 255.255.255.252
 no shutdown
!
! --- Cryptographic IPsec VPN Overlay (IKEv2 / AES-256-GCM) ---
! NOTE: 198.51.100.0/24 is an RFC 5737 TEST-NET-2 documentation/lab address range.
! In production, replace 198.51.100.1 with the provider-assigned public IP of the Cloud VPC gateway.
crypto ikev2 proposal IKEV2-PROPOSAL
 encryption aes-gcm-256
 prf sha384
 group 19 20
!
crypto ikev2 keyring IKEV2-KEYRING
 peer CLOUD-VPC-GW
  address 198.51.100.1
  pre-shared-key CiscoSecureVPN2026!
!
crypto ikev2 policy IKEV2-POLICY
 proposal IKEV2-PROPOSAL
!
crypto ikev2 profile IKEV2-PROFILE
 match identity remote address 198.51.100.1 255.255.255.255
 identity local address 198.51.100.2
 authentication remote pre-share
 authentication local pre-share
 keyring local IKEV2-KEYRING
!
crypto ipsec transform-set IPSEC-TRANSFORM esp-gcm 256
 mode tunnel
!
crypto ipsec profile IPSEC-CLOUD-PROFILE
 set transform-set IPSEC-TRANSFORM
 set ikev2-profile IKEV2-PROFILE
!
interface Tunnel100
 description IPsec-Overlay-Tunnel-to-Cloud-VPC
 ip address 169.254.0.2 255.255.255.252
 ip mtu 1436
 ip tcp adjust-mss 1396
 tunnel source GigabitEthernet0/0/1
 tunnel destination 198.51.100.1
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile IPSEC-CLOUD-PROFILE
 no shutdown
!
! --- Dynamic Routing Protocol Engine (Edge Router) ---
router ospf 1
 router-id 1.1.1.1
 log-adjacency-changes
 passive-interface default
 no passive-interface GigabitEthernet0/0/0
 network 10.255.255.0 0.0.0.3 area 0
 area 10 range 10.0.0.0 255.255.240.0
!
router bgp 65001
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 neighbor 169.254.0.1 remote-as 64512
 neighbor 169.254.0.1 description Peering-To-Cloud-VPC
 neighbor 169.254.0.1 update-source Tunnel100
 network 10.0.0.0 mask 255.255.240.0
!
! --- Edge Router Banner & Management Security ---
banner motd ^C
***********************************************************************
* WARNING: UNAUTHORIZED ACCESS TO GLOBAL-ENTERPRISE-IOT-WAN IS PROHIBITED.          *
* ALL SESSIONS ARE MONITORED AND LOGGED PURSUANT TO LAW.             *
***********************************************************************
^C
line con 0
 exec-timeout 5 0
 logging synchronous
 login local
line vty 0 4
 exec-timeout 5 0
 logging synchronous
 login local
 transport input ssh
!
end
